services:
  - type: web
    name: railsync-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # ortools/scikit-learn wheels are published for 3.12; newer runtimes
      # fall back to source builds that time out on the free plan.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set in the Render dashboard — the LLM routes degrade gracefully without it.
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
